<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 상품 목록</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/form.css">
    <link rel="stylesheet" href="/css/product.css">

    <style>
        .my-product-empty-box {
            max-width: 720px;
            margin: 40px auto 0;
            padding: 38px 34px;
            border-radius: 30px;
            text-align: center;
            background: linear-gradient(180deg, #fffdfb 0%, #fff5ec 100%);
            border: 1px solid #f0dfd0;
            box-shadow:
                    8px 10px 24px rgba(202, 166, 133, 0.12),
                    inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .my-product-empty-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #ffd0a1 0%, #ffad6b 100%);
            border: 1px solid #e9823a;
            color: #ffffff;
            font-size: 34px;
            box-shadow:
                    6px 8px 18px rgba(220, 104, 28, 0.22),
                    inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .my-product-empty-title {
            margin: 0;
            color: #70482c;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.4px;
        }

        .my-product-empty-desc {
            margin: 12px 0 22px;
            color: #876955;
            font-size: 15px;
            line-height: 1.8;
            font-weight: 700;
        }

        .my-product-empty-tip {
            margin: 0 auto 24px;
            padding: 16px 18px;
            max-width: 520px;
            border-radius: 20px;
            background: linear-gradient(180deg, #fff4e8 0%, #ffe4c8 100%);
            border: 1px solid #f0bf8c;
            color: #7a3d17;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.7;
        }
    </style>
</head>
<body>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

<aside class="side-drawer" id="sideDrawer">
    <div class="drawer-top">
        <div class="drawer-logo">oiso</div>
        <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>

    <p class="drawer-title">
        필요한 메뉴를 선택해서<br>
        원하는 화면으로 바로 이동할 수 있어요.
    </p>

    <nav class="drawer-menu">
        <a class="drawer-menu-link" href="/index.html">메인</a>
        <a class="drawer-menu-link" href="/product-list.html">상품목록</a>
        <a class="drawer-menu-link" href="/category/category.html">카테고리</a>
        <a class="drawer-menu-link" href="/product-register.html">상품등록</a>
        <a class="drawer-menu-link current-menu" href="/product-my-list.html">내 상품</a>
        <a class="drawer-menu-link" href="/exchange-requested-list.html">내가 신청한 교환</a>
        <a class="drawer-menu-link" href="/exchange-received-list.html">받은 교환</a>
        <a class="drawer-menu-link" href="/chat-room-list.html">채팅방</a>
        <a class="drawer-menu-link" href="/report-my-list.html">내 신고</a>
        <a class="drawer-menu-link" href="/report-all-list.html">전체 신고</a>
        <a class="drawer-menu-link" href="/exchange-guide.html">교환 가이드</a>
    </nav>

    <div class="drawer-bottom">현재 페이지: 내 상품 목록</div>
</aside>

<div class="sub-top-bar">
    <button class="hamburger-button" onclick="openDrawer()">☰</button>
    <a href="/index.html" class="sub-home-link">oiso</a>
    <div class="sub-right-actions" id="subRightActions"></div>
</div>

<div class="page-body">
    <div class="page-header">
        <div>
            <h1 class="page-title">내 상품 목록</h1>
            <p class="page-subtitle">
                내가 등록한 상품의 상태를 확인하고 상세보기나 수정/삭제 화면으로 이동할 수 있습니다.
            </p>
        </div>
        <div class="button-row">
            <a class="menu-link" href="/product-register.html">상품 등록</a>
            <a class="menu-link" href="/product-list.html">전체 상품</a>
        </div>
    </div>

    <div id="productContainer" class="product-container"></div>
</div>

<script>
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');

    function openDrawer() {
        sideDrawer.classList.add('open');
        drawerBackdrop.classList.add('show');
    }

    function closeDrawer() {
        sideDrawer.classList.remove('open');
        drawerBackdrop.classList.remove('show');
    }

    function logout() {
        alert('로그아웃되었습니다.');
        window.location.href = '/users/logout';
    }

    function renderSubRightActions(userData) {
        const subRightActions = document.getElementById('subRightActions');

        if (!subRightActions) {
            return;
        }

        if (userData.loggedIn) {
            subRightActions.innerHTML = `
                <a href="/mypage.html" class="main-icon-link" title="마이페이지">
                    <span class="person-icon person-icon-small"></span>
                </a>
                <button type="button" class="main-login-link main-logout-button" onclick="logout()">로그아웃</button>
            `;
        } else {
            subRightActions.innerHTML = '';
        }
    }

    checkLoginAndLoadMyProductList();

    function checkLoginAndLoadMyProductList() {
        fetch('/users/me-data')
            .then(response => response.json())
            .then(userData => {
                renderSubRightActions(userData);

                const container = document.getElementById('productContainer');

                if (!userData.loggedIn) {
                    container.className = '';
                    container.innerHTML = renderLoginRequiredBox();
                    return;
                }

                loadMyProductList();
            })
            .catch(error => {
                const container = document.getElementById('productContainer');
                container.className = '';
                container.innerHTML = renderLoginRequiredBox();
                console.error(error);
            });
    }

    function loadMyProductList() {
        fetch('/products/my-list-data')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('productContainer');

                if (!Array.isArray(data)) {
                    container.className = '';
                    container.innerHTML = renderLoginRequiredBox();
                    return;
                }

                if (data.length === 0) {
                    container.className = '';
                    container.innerHTML = `
                        <div class="my-product-empty-box">
                            <div class="my-product-empty-icon">📦</div>
                            <h2 class="my-product-empty-title">아직 등록한 상품이 없습니다</h2>
                            <p class="my-product-empty-desc">
                                교환하고 싶은 물건을 등록하면 이곳에서 상태를 확인하고<br>
                                수정, 삭제, 상세보기까지 한 번에 관리할 수 있습니다.
                            </p>
                            <div class="my-product-empty-tip">
                                상품을 등록하면 다른 사용자가 교환 신청을 보낼 수 있고,<br>
                                수락 후에는 채팅방에서 교환을 이어갈 수 있습니다.
                            </div>
                            <div class="button-row" style="justify-content:center;">
                                <a class="primary-button" href="/product-register.html">상품 등록하러 가기</a>
                                <a class="secondary-button" href="/product-list.html">전체 상품 둘러보기</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                let html = '';

                data.forEach(product => {
                    const productStatus = product.productStatus || '';
                    const reported = product.reported === true;

                    const cardClass = getProductCardClass(productStatus, reported);
                    const imageBadge = renderImageStatusBadge(productStatus, reported);
                    const statusBadge = renderStatusBadge(productStatus, reported);

                    html += `
                        <div class="${cardClass}" style="padding:18px; overflow:hidden;">
                            <div class="product-image-wrap" style="width:100%; aspect-ratio:1 / 1; border-radius:22px; overflow:hidden; background:#fff4ea; border:1px solid #f0dfd0;">
                                ${imageBadge}
                                <img
                                    src="${escapeHtml(product.productImagePath)}"
                                    alt="${escapeHtml(product.productName)}"
                                    style="width:100%; height:100%; object-fit:cover; display:block;"
                                >
                            </div>

                            <div style="margin-top:14px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
                                <div style="font-size:21px; font-weight:800; color:#714a2f; line-height:1.4; word-break:break-word;">
                                    ${escapeHtml(product.productName)}
                                </div>
                            </div>

                            <div style="margin-top:12px;">
                                ${statusBadge}
                            </div>

                            <div style="margin-top:10px; color:#7f6656; font-size:14px;">
                                ${escapeHtml(product.category == null ? '' : product.category)}
                            </div>

                            <div style="margin-top:6px; color:#90715c; font-size:14px;">
                                ${formatRelativeTime(product.regDt)}
                            </div>

                            <div class="button-row">
                                <a class="detail-link" href="/product-detail.html?productId=${product.productId}">상세보기</a>
                                <a class="secondary-button" href="/product-edit.html?productId=${product.productId}">수정/삭제</a>
                            </div>
                        </div>
                    `;
                });

                container.className = 'product-container';
                container.innerHTML = html;
            })
            .catch(error => {
                const container = document.getElementById('productContainer');
                container.className = '';
                container.innerHTML = renderLoginRequiredBox();
                console.error(error);
            });
    }

    function getProductCardClass(productStatus, reported) {
        if (reported) {
            return 'product-card reported-product-card';
        }

        if (productStatus === '거래완료') {
            return 'product-card completed-product-card';
        }

        if (productStatus === '예약중') {
            return 'product-card reserved-product-card';
        }

        return 'product-card';
    }

    function renderImageStatusBadge(productStatus, reported) {
        if (reported) {
            return '<div class="product-status-badge reported">신고됨</div>';
        }

        if (productStatus === '거래완료') {
            return '<div class="product-status-badge completed">거래완료</div>';
        }

        if (productStatus === '예약중') {
            return '<div class="product-status-badge reserved">예약중</div>';
        }

        return '';
    }

    function renderStatusBadge(productStatus, reported) {
        if (reported) {
            return '<span class="product-status-badge reported" style="position:static;">신고됨</span>';
        }

        if (productStatus === '판매중') {
            return '<span class="detail-status-badge sale">판매중</span>';
        }

        if (productStatus === '예약중') {
            return '<span class="detail-status-badge reserved">예약중</span>';
        }

        if (productStatus === '거래완료') {
            return '<span class="detail-status-badge completed">거래완료</span>';
        }

        return `<span class="detail-status-badge default">${escapeHtml(productStatus)}</span>`;
    }

    function formatRelativeTime(dateText) {
        if (!dateText) {
            return '';
        }

        const targetDate = new Date(dateText);
        if (Number.isNaN(targetDate.getTime())) {
            return dateText;
        }

        const now = new Date();
        const diffSeconds = Math.floor((now.getTime() - targetDate.getTime()) / 1000);

        if (diffSeconds < 60) {
            return '방금 전';
        }

        const diffMinutes = Math.floor(diffSeconds / 60);
        if (diffMinutes < 60) {
            return `${diffMinutes}분 전`;
        }

        const diffHours = Math.floor(diffMinutes / 60);
        if (diffHours < 24) {
            return `${diffHours}시간 전`;
        }

        const diffDays = Math.floor(diffHours / 24);
        if (diffDays < 30) {
            return `${diffDays}일 전`;
        }

        const diffMonths = Math.floor(diffDays / 30);
        if (diffMonths < 12) {
            return `${diffMonths}개월 전`;
        }

        const diffYears = Math.floor(diffMonths / 12);
        return `${diffYears}년 전`;
    }

    function renderLoginRequiredBox() {
        return `
            <div class="login-required-box">
                <h2 class="login-required-title">로그인이 필요합니다</h2>
                <p class="login-required-desc">
                    내 상품 목록은 로그인한 사용자만 확인할 수 있습니다.<br>
                    먼저 로그인한 뒤 다시 이용해주세요.
                </p>
                <div class="button-row" style="justify-content:center;">
                    <a class="primary-button" href="/login.html">로그인하러 가기</a>
                    <a class="secondary-button" href="/index.html">메인으로 이동</a>
                </div>
            </div>
        `;
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeDrawer();
        }
    });
</script>
</body>
</html>
