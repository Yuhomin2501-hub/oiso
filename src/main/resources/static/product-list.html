<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/form.css">
    <link rel="stylesheet" href="/css/product.css">

    <style>
        .product-empty-box {
            max-width: 760px;
            margin: 40px auto 0;
            padding: 38px 34px;
            border-radius: 30px;
            text-align: center;
            background: linear-gradient(180deg, #fffdfb 0%, #fff5ec 100%);
            border: 1px solid #f0dfd0;
            box-shadow:
                    8px 10px 24px rgba(202, 166, 133, 0.12),
                    inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .product-empty-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #ffd0a1 0%, #ffad6b 100%);
            border: 1px solid #e9823a;
            color: #ffffff;
            font-size: 34px;
            box-shadow:
                    6px 8px 18px rgba(220, 104, 28, 0.22),
                    inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .product-empty-title {
            margin: 0;
            color: #70482c;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.4px;
        }

        .product-empty-desc {
            margin: 12px 0 22px;
            color: #876955;
            font-size: 15px;
            line-height: 1.8;
            font-weight: 700;
        }

        .product-empty-tip {
            margin: 0 auto 24px;
            padding: 16px 18px;
            max-width: 560px;
            border-radius: 20px;
            background: linear-gradient(180deg, #fff4e8 0%, #ffe4c8 100%);
            border: 1px solid #f0bf8c;
            color: #7a3d17;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.7;
        }
    </style>
</head>
<body>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

<aside class="side-drawer" id="sideDrawer">
    <div class="drawer-top">
        <div class="drawer-logo">oiso</div>
        <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>

    <nav class="drawer-menu">
        <a class="drawer-menu-link" href="/index.html">메인</a>
        <a class="drawer-menu-link current-menu" href="/product-list.html">상품목록</a>
        <a class="drawer-menu-link" href="/category/category.html">카테고리</a>
        <a class="drawer-menu-link" href="/product-register.html">상품등록</a>
        <a class="drawer-menu-link" href="/product-my-list.html">내 상품</a>
        <a class="drawer-menu-link" href="/exchange-requested-list.html">내가 신청한 교환</a>
        <a class="drawer-menu-link" href="/exchange-received-list.html">받은 교환</a>
        <a class="drawer-menu-link" href="/chat-room-list.html">채팅방</a>
        <a class="drawer-menu-link" href="/report-my-list.html">내 신고</a>
        <a class="drawer-menu-link" href="/report-all-list.html">전체 신고</a>
        <a class="drawer-menu-link" href="/exchange-guide.html">교환 가이드</a>
    </nav>

    <div class="drawer-bottom">현재 페이지: 상품 목록</div>
</aside>

<div class="sub-top-bar">
    <button class="hamburger-button" onclick="openDrawer()">☰</button>
    <a href="/index.html" class="sub-home-link">oiso</a>
    <div class="sub-right-actions" id="subRightActions"></div>
</div>

<div class="page-body">
    <div class="page-header">
        <div>
            <h1 class="page-title">상품 목록</h1>
            <p class="page-subtitle" id="productListSubtitle">
                등록된 상품을 둘러보고 교환하고 싶은 상품의 상세 화면으로 이동해보세요.
            </p>
        </div>

        <div class="button-row">
            <a class="menu-link" href="/product-register.html">상품 등록</a>
            <a class="menu-link" href="/product-my-list.html">내 상품 목록</a>
        </div>
    </div>

    <div class="product-search-row">
        <input
                type="text"
                id="searchKeyword"
                class="input-field product-search-input"
                placeholder="상품명을 입력해서 검색해보세요"
        >
        <button class="primary-button" onclick="searchProducts()">검색</button>
        <button class="secondary-button" onclick="resetSearch()">전체보기</button>
    </div>

    <div id="productContainer" class="product-container"></div>
</div>

<script>
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const params = new URLSearchParams(window.location.search);

    function openDrawer() {
        sideDrawer.classList.add('open');
        drawerBackdrop.classList.add('show');
    }

    function closeDrawer() {
        sideDrawer.classList.remove('open');
        drawerBackdrop.classList.remove('show');
    }

    function logout() {
        alert('로그아웃되었습니다.');
        window.location.href = '/users/logout';
    }

    function renderSubRightActions() {
        fetch('/users/me-data')
            .then(response => response.json())
            .then(data => {
                const subRightActions = document.getElementById('subRightActions');

                if (!subRightActions) {
                    return;
                }

                if (data.loggedIn) {
                    subRightActions.innerHTML = `
                        <a href="/mypage.html" class="main-icon-link" title="마이페이지">
                            <span class="person-icon person-icon-small"></span>
                        </a>
                        <button type="button" class="main-login-link main-logout-button" onclick="logout()">로그아웃</button>
                    `;
                } else {
                    subRightActions.innerHTML = '';
                }
            })
            .catch(error => {
                console.error(error);
            });
    }

    function searchProducts() {
        const keyword = document.getElementById('searchKeyword').value.trim();

        if (keyword === '') {
            window.location.href = '/product-list.html';
            return;
        }

        window.location.href = `/product-list.html?keyword=${encodeURIComponent(keyword)}`;
    }

    function resetSearch() {
        window.location.href = '/product-list.html';
    }

    function loadProductList() {
        const keyword = params.get('keyword');
        const url = keyword && keyword.trim() !== ''
            ? `/products/list-data?keyword=${encodeURIComponent(keyword)}`
            : '/products/list-data';

        if (keyword && keyword.trim() !== '') {
            document.getElementById('searchKeyword').value = keyword;
            document.getElementById('productListSubtitle').innerText = `"${keyword}" 검색 결과입니다.`;
        }

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('productContainer');

                if (!Array.isArray(data)) {
                    container.className = '';
                    container.innerHTML = renderLoginRequiredBox();
                    return;
                }

                if (data.length === 0) {
                    container.className = '';
                    container.innerHTML = keyword && keyword.trim() !== ''
                        ? renderSearchEmptyBox(keyword)
                        : renderProductEmptyBox();
                    return;
                }

                let html = '';

                data.forEach(product => {
                    const productStatus = product.productStatus || '';
                    const reported = product.reported === true;

                    const cardClass = getProductCardClass(productStatus, reported);
                    const statusBadge = renderImageStatusBadge(productStatus, reported);

                    html += `
                        <a href="/product-detail.html?productId=${product.productId}" style="text-decoration:none; color:inherit;">
                            <div class="${cardClass}" style="padding:18px; overflow:hidden;">
                                <div class="product-image-wrap" style="width:100%; aspect-ratio:1 / 1; border-radius:22px; overflow:hidden; background:#fff4ea; border:1px solid #f0dfd0;">
                                    ${statusBadge}
                                    <img
                                        src="${escapeHtml(product.productImagePath)}"
                                        alt="${escapeHtml(product.productName)}"
                                        style="width:100%; height:100%; object-fit:cover; display:block;"
                                    >
                                </div>

                                <div style="margin-top:14px; font-size:21px; font-weight:800; color:#714a2f; line-height:1.4;">
                                    ${escapeHtml(product.productName)}
                                </div>

                                <div style="margin-top:8px; color:#7f6656; font-size:14px;">
                                    ${escapeHtml(product.category == null ? '' : product.category)}
                                </div>

                                <div style="margin-top:6px; color:#90715c; font-size:14px;">
                                    ${formatRelativeTime(product.regDt)}
                                </div>
                            </div>
                        </a>
                    `;
                });

                container.className = 'product-container';
                container.innerHTML = html;
            })
            .catch(error => {
                const container = document.getElementById('productContainer');
                container.className = '';
                container.innerHTML = '<div class="empty-message">상품 목록을 불러오는 중 문제가 발생했습니다.</div>';
                console.error(error);
            });
    }

    function getProductCardClass(productStatus, reported) {
        if (reported) {
            return 'product-card reported-product-card';
        }

        if (productStatus === '거래완료') {
            return 'product-card completed-product-card';
        }

        if (productStatus === '예약중') {
            return 'product-card reserved-product-card';
        }

        return 'product-card';
    }

    function renderImageStatusBadge(productStatus, reported) {
        if (reported) {
            return '<div class="product-status-badge reported">신고됨</div>';
        }

        if (productStatus === '거래완료') {
            return '<div class="product-status-badge completed">거래완료</div>';
        }

        if (productStatus === '예약중') {
            return '<div class="product-status-badge reserved">예약중</div>';
        }

        return '';
    }

    function renderSearchEmptyBox(keyword) {
        return `
            <div class="product-empty-box">
                <div class="product-empty-icon">🔎</div>
                <h2 class="product-empty-title">검색 결과가 없습니다</h2>
                <p class="product-empty-desc">
                    <strong>${escapeHtml(keyword)}</strong>에 맞는 상품을 찾지 못했습니다.<br>
                    다른 키워드로 검색하거나 전체 상품을 확인해보세요.
                </p>
                <div class="product-empty-tip">
                    상품명 일부만 입력해도 검색할 수 있습니다.<br>
                    예: 노트북, 의자, 책, 충전기
                </div>
                <div class="button-row" style="justify-content:center;">
                    <a class="primary-button" href="/product-list.html">전체 상품 보기</a>
                    <a class="secondary-button" href="/category/category.html">카테고리 보기</a>
                    <a class="secondary-button" href="/product-register.html">상품 등록하기</a>
                </div>
            </div>
        `;
    }

    function renderProductEmptyBox() {
        return `
            <div class="product-empty-box">
                <div class="product-empty-icon">📦</div>
                <h2 class="product-empty-title">아직 등록된 상품이 없습니다</h2>
                <p class="product-empty-desc">
                    상품이 등록되면 이곳에서 전체 상품을 확인하고<br>
                    교환하고 싶은 상품의 상세 화면으로 이동할 수 있습니다.
                </p>
                <div class="product-empty-tip">
                    사용하지 않는 물건을 등록하면 다른 사용자와 교환을 시작할 수 있습니다.
                </div>
                <div class="button-row" style="justify-content:center;">
                    <a class="primary-button" href="/product-register.html">상품 등록하기</a>
                    <a class="secondary-button" href="/category/category.html">카테고리 보기</a>
                    <a class="secondary-button" href="/index.html">메인으로 이동</a>
                </div>
            </div>
        `;
    }

    function formatRelativeTime(dateText) {
        if (!dateText) {
            return '';
        }

        const targetDate = new Date(dateText);
        if (Number.isNaN(targetDate.getTime())) {
            return dateText;
        }

        const now = new Date();
        const diffSeconds = Math.floor((now.getTime() - targetDate.getTime()) / 1000);

        if (diffSeconds < 60) {
            return '방금 전';
        }

        const diffMinutes = Math.floor(diffSeconds / 60);
        if (diffMinutes < 60) {
            return `${diffMinutes}분 전`;
        }

        const diffHours = Math.floor(diffMinutes / 60);
        if (diffHours < 24) {
            return `${diffHours}시간 전`;
        }

        const diffDays = Math.floor(diffHours / 24);
        if (diffDays < 30) {
            return `${diffDays}일 전`;
        }

        const diffMonths = Math.floor(diffDays / 30);
        if (diffMonths < 12) {
            return `${diffMonths}개월 전`;
        }

        const diffYears = Math.floor(diffMonths / 12);
        return `${diffYears}년 전`;
    }

    function renderLoginRequiredBox() {
        return `
            <div class="login-required-box">
                <h2 class="login-required-title">로그인이 필요합니다</h2>
                <p class="login-required-desc">
                    이 화면은 로그인한 뒤 더 편하게 이용할 수 있습니다.<br>
                    먼저 로그인한 뒤 다시 이용해주세요.
                </p>
                <div class="button-row" style="justify-content:center;">
                    <a class="primary-button" href="/login.html">로그인하러 가기</a>
                    <a class="secondary-button" href="/index.html">메인으로 이동</a>
                </div>
            </div>
        `;
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    document.getElementById('searchKeyword').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            searchProducts();
        }
    });

    renderSubRightActions();
    loadProductList();

    window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeDrawer();
        }
    });
</script>
</body>
</html>
