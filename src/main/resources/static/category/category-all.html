<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전체 카테고리 - oiso</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/category.css">
    <link rel="stylesheet" href="/css/product.css">
    <style>
        .favorite-button {
            position: absolute;
            top: 28px;
            right: 28px;
            z-index: 10;

            width: 44px;
            height: 44px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.92);

            font-size: 27px;
            line-height: 1;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #9a7358;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .favorite-button:hover {
            transform: scale(1.08);
        }

        .favorite-button.active {
            color: #e85a5a;
        }
    </style>
</head>
<body>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

<aside class="side-drawer" id="sideDrawer">
    <div class="drawer-top">
        <div class="drawer-logo">oiso</div>
        <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>

    <p class="drawer-title">
        필요한 메뉴를 선택해서<br>
        원하는 화면으로 바로 이동할 수 있어요.
    </p>

    <nav class="drawer-menu">
        <a class="drawer-menu-link" href="/index.html">메인</a>
        <a class="drawer-menu-link" href="/product-list.html">상품목록</a>
        <a class="drawer-menu-link current-menu" href="/category/category.html">카테고리</a>
        <a class="drawer-menu-link" href="/product-register.html">상품등록</a>
        <a class="drawer-menu-link" href="/product-my-list.html">내 상품</a>
        <a class="drawer-menu-link" href="/exchange-requested-list.html">내가 신청한 교환</a>
        <a class="drawer-menu-link" href="/exchange-received-list.html">받은 교환</a>
        <a class="drawer-menu-link" href="/chat-room-list.html">채팅방</a>
        <a class="drawer-menu-link" href="/report-my-list.html">내 신고</a>
        <a class="drawer-menu-link" href="/report-all-list.html">전체 신고</a>
        <a class="drawer-menu-link" href="/exchange-guide.html">교환 가이드</a>
    </nav>

    <div class="drawer-bottom">
        현재 보고 있는 화면은<br>
        전체 카테고리 상품 페이지입니다.
    </div>
</aside>

<div class="sub-top-bar">
    <button class="hamburger-button" onclick="openDrawer()">☰</button>
    <a href="/index.html" class="sub-home-link">oiso</a>
    <div class="sub-right-actions" id="subRightActions"></div>
</div>

<div class="category-detail-wrap">
    <div class="detail-box category-detail-card">
        <div class="category-detail-title-row">
            <div>
                <h1 class="category-detail-title">전체 카테고리</h1>
                <p class="category-detail-desc">
                    전체 분류 기준으로 상품을 확인하는 화면입니다.
                </p>
            </div>
        </div>

        <div class="category-chip-row">
            <a class="category-chip active" href="/category/category-all.html">전체</a>
            <a class="category-chip" href="/category/category-clothes.html">의류</a>
            <a class="category-chip" href="/category/category-electronics.html">전자기기</a>
            <a class="category-chip" href="/category/category-book.html">도서</a>
            <a class="category-chip" href="/category/category-living.html">생활용품</a>
            <a class="category-chip" href="/category/category-etc.html">기타</a>
        </div>
    </div>

    <div id="productContainer" class="product-container" style="margin-top:24px;"></div>
</div>

<script>
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');

    let favoriteProductIds = new Set();

    function openDrawer() {
        sideDrawer.classList.add('open');
        drawerBackdrop.classList.add('show');
    }

    function closeDrawer() {
        sideDrawer.classList.remove('open');
        drawerBackdrop.classList.remove('show');
    }

    function logout() {
        alert('로그아웃되었습니다.');
        window.location.href = '/users/logout';
    }

    function renderSubRightActions() {
        fetch('/users/me-data')
            .then(response => response.json())
            .then(userData => {
                const subRightActions = document.getElementById('subRightActions');

                if (!subRightActions) {
                    return;
                }

                if (userData.loggedIn) {
                    subRightActions.innerHTML = `
                        <a href="/mypage.html" class="main-icon-link" title="마이페이지">
                            <span class="person-icon person-icon-small"></span>
                        </a>
                        <button type="button" class="main-login-link main-logout-button" onclick="logout()">로그아웃</button>
                    `;
                } else {
                    subRightActions.innerHTML = '';
                }
            })
            .catch(error => {
                console.error(error);
            });
    }

    function loadFavoriteProductIds() {

        return fetch('/favorites/my-product-ids')
            .then(response => response.json())
            .then(data => {

                if (Array.isArray(data)) {
                    favoriteProductIds = new Set(data);
                } else {
                    favoriteProductIds = new Set();
                }
            })
            .catch(error => {
                favoriteProductIds = new Set();
                console.error(error);
            });
    }

    function loadCategoryProducts() {
        fetch('/products/list-data')
            .then(response => response.json())
            .then(data => renderProductList(data, '전체 카테고리'))
            .catch(error => {
                document.getElementById('productContainer').className = '';
                document.getElementById('productContainer').innerHTML = '<div class="empty-message category-empty-box">전체 카테고리 상품을 불러오는 중 문제가 발생했습니다.</div>';
                console.error(error);
            });
    }

    function renderProductList(data, title) {
        const container = document.getElementById('productContainer');

        if (!Array.isArray(data) || data.length === 0) {
            container.className = '';
            container.innerHTML = `
                <div class="empty-message category-empty-box">
                    <h2 class="category-empty-title">${title} 상품 정보가 없습니다</h2>
                    <p class="category-empty-desc">
                        현재 등록된 상품이 없습니다.
                    </p>
                    <div class="category-action-row">
                        <a href="/product-list.html" class="primary-button">상품목록 보기</a>
                        <a href="/product-register.html" class="secondary-button">상품 등록하기</a>
                    </div>
                </div>
            `;
            return;
        }

        let html = '';

        data.forEach(product => {

            const productStatus = product.productStatus || '';
            const reported = product.reported === true;

            const cardClass = getProductCardClass(productStatus, reported);
            const statusBadge = renderImageStatusBadge(productStatus, reported);

            const favorite = favoriteProductIds.has(product.productId);

            html += `
        <div class="${cardClass}" style="padding:18px; overflow:hidden; position:relative;">

            <button
                type="button"
                class="favorite-button ${favorite ? 'active' : ''}"
                onclick="toggleFavorite(event, ${product.productId}, this)"
                title="${favorite ? '찜 취소' : '찜하기'}"
                aria-pressed="${favorite}"
            >
                ${favorite ? '♥' : '♡'}
            </button>

            <a
                href="/product-detail.html?productId=${product.productId}"
                style="text-decoration:none; color:inherit; display:block;"
            >
                <div
                    class="product-image-wrap"
                    style="width:100%; aspect-ratio:1 / 1; border-radius:22px; overflow:hidden; background:#fff4ea; border:1px solid #f0dfd0;"
                >
                    ${statusBadge}

                    <img
                        src="${escapeHtml(product.productImagePath)}"
                        alt="${escapeHtml(product.productName)}"
                        style="width:100%; height:100%; object-fit:cover; display:block;"
                    >
                </div>

                <div style="margin-top:14px; font-size:21px; font-weight:800; color:#714a2f; line-height:1.4;">
                    ${escapeHtml(product.productName)}
                </div>

                <div style="margin-top:8px; color:#7f6656; font-size:14px;">
                    ${escapeHtml(product.category == null ? '' : product.category)}
                </div>

                <div style="margin-top:6px; color:#90715c; font-size:14px;">
                    ${formatRelativeTime(product.regDt)}
                </div>

            </a>

        </div>
    `;
        });

        container.className = 'product-container';
        container.innerHTML = html;
    }

    function toggleFavorite(event, productId, button) {

        event.preventDefault();
        event.stopPropagation();

        const favorite = favoriteProductIds.has(productId);

        const url = favorite
            ? `/favorites/delete?productId=${encodeURIComponent(productId)}`
            : `/favorites/add?productId=${encodeURIComponent(productId)}`;

        fetch(url, {
            method: 'POST'
        })
            .then(response => response.text())
            .then(result => {

                if (result.includes('로그인')) {
                    alert('로그인 후 이용 가능합니다.');
                    return;
                }

                if (result === '찜 추가 완료' ||
                    result === '이미 찜한 상품입니다.') {

                    favoriteProductIds.add(productId);

                    button.innerText = '♥';
                    button.classList.add('active');
                    button.title = '찜 취소';
                    button.setAttribute('aria-pressed', 'true');

                    return;
                }

                if (result === '찜 삭제 완료' ||
                    result === '찜하지 않은 상품입니다.') {

                    favoriteProductIds.delete(productId);

                    button.innerText = '♡';
                    button.classList.remove('active');
                    button.title = '찜하기';
                    button.setAttribute('aria-pressed', 'false');

                    return;
                }

                alert(result);
            })
            .catch(error => {
                alert('찜 처리 중 문제가 발생했습니다.');
                console.error(error);
            });
    }

    function getProductCardClass(productStatus, reported) {
        if (reported) {
            return 'product-card reported-product-card';
        }

        if (productStatus === '거래완료') {
            return 'product-card completed-product-card';
        }

        if (productStatus === '예약중') {
            return 'product-card reserved-product-card';
        }

        return 'product-card';
    }

    function renderImageStatusBadge(productStatus, reported) {
        if (reported) {
            return '<div class="product-status-badge reported">신고됨</div>';
        }

        if (productStatus === '거래완료') {
            return '<div class="product-status-badge completed">거래완료</div>';
        }

        if (productStatus === '예약중') {
            return '<div class="product-status-badge reserved">예약중</div>';
        }

        return '';
    }

    function formatRelativeTime(dateText) {
        if (!dateText) {
            return '';
        }

        const targetDate = new Date(dateText);

        if (Number.isNaN(targetDate.getTime())) {
            return dateText;
        }

        const now = new Date();
        const diffSeconds = Math.floor((now.getTime() - targetDate.getTime()) / 1000);

        if (diffSeconds < 60) {
            return '방금 전';
        }

        const diffMinutes = Math.floor(diffSeconds / 60);

        if (diffMinutes < 60) {
            return `${diffMinutes}분 전`;
        }

        const diffHours = Math.floor(diffMinutes / 60);

        if (diffHours < 24) {
            return `${diffHours}시간 전`;
        }

        const diffDays = Math.floor(diffHours / 24);

        if (diffDays < 30) {
            return `${diffDays}일 전`;
        }

        const diffMonths = Math.floor(diffDays / 30);

        if (diffMonths < 12) {
            return `${diffMonths}개월 전`;
        }

        const diffYears = Math.floor(diffMonths / 12);
        return `${diffYears}년 전`;
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    renderSubRightActions();

    loadFavoriteProductIds()
        .then(() => loadCategoryProducts());

    window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeDrawer();
        }
    });
</script>
</body>
</html>
