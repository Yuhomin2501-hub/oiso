<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/form.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

<aside class="side-drawer" id="sideDrawer">
    <div class="drawer-top">
        <div class="drawer-logo">oiso</div>
        <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>

    <p class="drawer-title">
        필요한 메뉴를 선택해서<br>
        원하는 화면으로 바로 이동할 수 있어요.
    </p>

    <nav class="drawer-menu">
        <a class="drawer-menu-link" href="/index.html">메인</a>
        <a class="drawer-menu-link" href="/product-list.html">상품목록</a>
        <a class="drawer-menu-link" href="/category/category.html">카테고리</a>
        <a class="drawer-menu-link" href="/product-register.html">상품등록</a>
        <a class="drawer-menu-link" href="/product-my-list.html">내 상품</a>
        <a class="drawer-menu-link" href="/exchange-requested-list.html">내가 신청한 교환</a>
        <a class="drawer-menu-link" href="/exchange-received-list.html">받은 교환</a>
        <a class="drawer-menu-link" href="/chat-room-list.html">채팅방</a>
        <a class="drawer-menu-link" href="/report-my-list.html">내 신고</a>
        <a class="drawer-menu-link" href="/report-all-list.html">전체 신고</a>
        <a class="drawer-menu-link current-menu" href="/reset-password.html">비밀번호 재설정</a>
    </nav>

    <div class="drawer-bottom">
        비밀번호를 새로 설정하는 페이지입니다.
    </div>
</aside>

<div class="sub-top-bar">
    <button class="hamburger-button" onclick="openDrawer()">☰</button>
    <a href="/index.html" class="sub-home-link">oiso</a>
</div>

<div class="login-page">
    <div class="login-card">
        <h1 class="login-title">비밀번호 재설정</h1>
        <p class="login-desc">
            가입된 이메일, 이름, 전화번호를 입력한 뒤<br>
            새 비밀번호를 설정해주세요.
        </p>

        <div id="resetMessageBox"></div>

        <div class="form-group">
            <label for="userEmail">이메일</label>
            <input type="email" id="userEmail" class="input-field" placeholder="이메일을 입력하세요">
        </div>

        <div class="form-group">
            <label for="userName">이름</label>
            <input type="text" id="userName" class="input-field" placeholder="이름을 입력하세요">
        </div>

        <div class="form-group">
            <label for="userPnum">전화번호</label>
            <input type="text" id="userPnum" class="input-field" placeholder="전화번호를 입력하세요">
        </div>

        <div class="form-group">
            <label for="newUserPwd">새 비밀번호</label>
            <input type="password" id="newUserPwd" class="input-field" placeholder="새 비밀번호를 입력하세요">
        </div>

        <div class="login-form-actions">
            <button class="primary-button" onclick="resetPassword()">비밀번호 재설정</button>
            <a href="/find-account.html" class="secondary-button">아이디 찾기</a>
            <a href="/login.html" class="secondary-button">로그인으로 돌아가기</a>
        </div>
    </div>
</div>

<script>
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');

    function openDrawer() {
        sideDrawer.classList.add('open');
        drawerBackdrop.classList.add('show');
    }

    function closeDrawer() {
        sideDrawer.classList.remove('open');
        drawerBackdrop.classList.remove('show');
    }

    function resetPassword() {
        const userEmail = document.getElementById('userEmail').value.trim();
        const userName = document.getElementById('userName').value.trim();
        const userPnum = document.getElementById('userPnum').value.trim();
        const newUserPwd = document.getElementById('newUserPwd').value.trim();

        if (userEmail === '') {
            alert('이메일을 입력하세요.');
            return;
        }

        if (userName === '') {
            alert('이름을 입력하세요.');
            return;
        }

        if (userPnum === '') {
            alert('전화번호를 입력하세요.');
            return;
        }

        if (newUserPwd === '') {
            alert('새 비밀번호를 입력하세요.');
            return;
        }

        fetch(`/users/reset-password?userEmail=${encodeURIComponent(userEmail)}&userName=${encodeURIComponent(userName)}&userPnum=${encodeURIComponent(userPnum)}&newUserPwd=${encodeURIComponent(newUserPwd)}`)
            .then(response => response.text())
            .then(message => {
                const resetMessageBox = document.getElementById('resetMessageBox');

                if (message.includes('비밀번호가 재설정되었습니다')) {
                    resetMessageBox.innerHTML = `
                        <div class="login-info-box">
                            ${escapeHtml(message)}
                        </div>
                    `;
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1200);
                    return;
                }

                resetMessageBox.innerHTML = `
                    <div class="login-error-box">
                        ${escapeHtml(message)}
                    </div>
                `;
            })
            .catch(error => {
                document.getElementById('resetMessageBox').innerHTML = `
                    <div class="login-error-box">
                        비밀번호 재설정 처리 중 문제가 발생했습니다.
                    </div>
                `;
                console.error(error);
            });
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    document.getElementById('newUserPwd').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            resetPassword();
        }
    });

    window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeDrawer();
        }
    });
</script>
</body>
</html>
