<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 찜 상품</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/form.css">
    <link rel="stylesheet" href="/css/product.css">

    <style>
        .favorite-empty-box {
            max-width: 720px;
            margin: 40px auto 0;
            padding: 38px 34px;
            border-radius: 30px;
            text-align: center;
            background: linear-gradient(180deg, #fffdfb 0%, #fff5ec 100%);
            border: 1px solid #f0dfd0;
            box-shadow:
                    8px 10px 24px rgba(202, 166, 133, 0.12),
                    inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .favorite-empty-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #ffd0a1 0%, #ffad6b 100%);
            border: 1px solid #e9823a;
            color: #ffffff;
            font-size: 34px;
            box-shadow:
                    6px 8px 18px rgba(220, 104, 28, 0.22),
                    inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .favorite-empty-title {
            margin: 0;
            color: #70482c;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.4px;
        }

        .favorite-empty-desc {
            margin: 12px 0 22px;
            color: #876955;
            font-size: 15px;
            line-height: 1.8;
            font-weight: 700;
        }

        .favorite-empty-tip {
            margin: 0 auto 24px;
            padding: 16px 18px;
            max-width: 520px;
            border-radius: 20px;
            background: linear-gradient(180deg, #fff4e8 0%, #ffe4c8 100%);
            border: 1px solid #f0bf8c;
            color: #7a3d17;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.7;
        }

        .favorite-button {
            position: absolute;
            top: 28px;
            right: 28px;
            z-index: 10;

            width: 44px;
            height: 44px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.92);

            font-size: 27px;
            line-height: 1;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #e85a5a;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .favorite-button:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

<aside class="side-drawer" id="sideDrawer">
    <div class="drawer-top">
        <div class="drawer-logo">oiso</div>
        <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>

    <p class="drawer-title">
        필요한 메뉴를 선택해서<br>
        원하는 화면으로 바로 이동할 수 있어요.
    </p>

    <nav class="drawer-menu">
        <a class="drawer-menu-link" href="/index.html">메인</a>
        <a class="drawer-menu-link" href="/product-list.html">상품목록</a>
        <a class="drawer-menu-link" href="/category/category.html">카테고리</a>
        <a class="drawer-menu-link" href="/product-register.html">상품등록</a>
        <a class="drawer-menu-link" href="/product-my-list.html">내 상품</a>
        <a class="drawer-menu-link current-menu" href="/favorite-list.html">내 찜 상품</a>
        <a class="drawer-menu-link" href="/exchange-requested-list.html">내가 신청한 교환</a>
        <a class="drawer-menu-link" href="/exchange-received-list.html">받은 교환</a>
        <a class="drawer-menu-link" href="/chat-room-list.html">채팅방</a>
        <a class="drawer-menu-link" href="/report-my-list.html">내 신고</a>
        <a class="drawer-menu-link" href="/report-all-list.html">전체 신고</a>
        <a class="drawer-menu-link" href="/exchange-guide.html">교환 가이드</a>
    </nav>

    <div class="drawer-bottom">
        현재 페이지: 내 찜 상품
    </div>
</aside>

<div class="sub-top-bar">
    <button class="hamburger-button" onclick="openDrawer()">☰</button>
    <a href="/index.html" class="sub-home-link">oiso</a>
    <div class="sub-right-actions" id="subRightActions"></div>
</div>

<div class="page-body">
    <div class="page-header">
        <div>
            <h1 class="page-title">내 찜 상품</h1>
            <p class="page-subtitle">
                내가 찜한 상품을 확인하고 관심이 없어진 상품은 찜을 취소할 수 있습니다.
            </p>
        </div>

        <div class="button-row">
            <a class="menu-link" href="/product-list.html">전체 상품</a>
            <a class="menu-link" href="/mypage.html">마이페이지</a>
        </div>
    </div>

    <div id="productContainer" class="product-container"></div>
</div>

<script>
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');

    function openDrawer() {
        sideDrawer.classList.add('open');
        drawerBackdrop.classList.add('show');
    }

    function closeDrawer() {
        sideDrawer.classList.remove('open');
        drawerBackdrop.classList.remove('show');
    }

    function logout() {
        alert('로그아웃되었습니다.');
        window.location.href = '/users/logout';
    }

    function renderSubRightActions(userData) {
        const subRightActions = document.getElementById('subRightActions');

        if (!subRightActions) {
            return;
        }

        if (userData.loggedIn) {
            subRightActions.innerHTML = `
                <a href="/mypage.html" class="main-icon-link" title="마이페이지">
                    <span class="person-icon person-icon-small"></span>
                </a>
                <button
                    type="button"
                    class="main-login-link main-logout-button"
                    onclick="logout()"
                >
                    로그아웃
                </button>
            `;
        } else {
            subRightActions.innerHTML = '';
        }
    }

    checkLoginAndLoadFavoriteList();

    function checkLoginAndLoadFavoriteList() {
        fetch('/users/me-data')
            .then(response => response.json())
            .then(userData => {
                renderSubRightActions(userData);

                const container = document.getElementById('productContainer');

                if (!userData.loggedIn) {
                    container.className = '';
                    container.innerHTML = renderLoginRequiredBox();
                    return;
                }

                loadFavoriteProductList();
            })
            .catch(error => {
                const container = document.getElementById('productContainer');

                container.className = '';
                container.innerHTML = renderLoginRequiredBox();

                console.error(error);
            });
    }

    async function loadFavoriteProductList() {
        const container = document.getElementById('productContainer');

        try {
            const favoriteResponse = await fetch('/favorites/my-product-ids');

            if (!favoriteResponse.ok) {
                throw new Error('찜 목록 조회 실패');
            }

            const favoriteProductIds = await favoriteResponse.json();

            if (!Array.isArray(favoriteProductIds) || favoriteProductIds.length === 0) {
                renderFavoriteEmptyBox();
                return;
            }

            const products = await Promise.all(
                favoriteProductIds.map(async favoriteProductId => {
                    try {
                        const response = await fetch(
                            '/products/detail-data?productId=' +
                            encodeURIComponent(favoriteProductId)
                        );

                        if (!response.ok) {
                            return null;
                        }

                        const product = await response.json();

                        if (!product || !product.productId) {
                            return null;
                        }

                        return product;
                    } catch (error) {
                        console.error(error);
                        return null;
                    }
                })
            );

            const validProducts = products.filter(product => product != null);

            if (validProducts.length === 0) {
                renderFavoriteEmptyBox();
                return;
            }

            let html = '';

            validProducts.forEach(product => {
                const productStatus = product.productStatus || '';
                const reported = product.reported === true;

                const cardClass = getProductCardClass(productStatus, reported);
                const imageBadge = renderImageStatusBadge(productStatus, reported);
                const statusBadge = renderStatusBadge(productStatus, reported);

                const imagePath = product.productImagePath || '';
                const productName = product.productName || '';
                const category = product.category || '';

                html += `
                    <div
                        class="${cardClass}"
                        data-product-id="${product.productId}"
                        style="padding:18px; overflow:hidden; position:relative;"
                    >
                        <button
                            type="button"
                            class="favorite-button"
                            onclick="deleteFavorite(${product.productId}, this)"
                            title="찜 취소"
                            aria-label="찜 취소"
                            aria-pressed="true"
                        >
                            ♥
                        </button>

                        <div
                            class="product-image-wrap"
                            style="
                                width:100%;
                                aspect-ratio:1 / 1;
                                border-radius:22px;
                                overflow:hidden;
                                background:#fff4ea;
                                border:1px solid #f0dfd0;
                            "
                        >
                            ${imageBadge}

                            <img
                                src="${escapeHtml(imagePath)}"
                                alt="${escapeHtml(productName)}"
                                style="
                                    width:100%;
                                    height:100%;
                                    object-fit:cover;
                                    display:block;
                                "
                            >
                        </div>

                        <div
                            style="
                                margin-top:14px;
                                font-size:21px;
                                font-weight:800;
                                color:#714a2f;
                                line-height:1.4;
                                word-break:break-word;
                            "
                        >
                            ${escapeHtml(productName)}
                        </div>

                        <div style="margin-top:12px;">
                            ${statusBadge}
                        </div>

                        <div
                            style="
                                margin-top:10px;
                                color:#7f6656;
                                font-size:14px;
                            "
                        >
                            ${escapeHtml(category)}
                        </div>

                        <div
                            style="
                                margin-top:6px;
                                color:#90715c;
                                font-size:14px;
                            "
                        >
                            ${formatRelativeTime(product.regDt)}
                        </div>

                        <div class="button-row">
                            <a
                                class="detail-link"
                                href="/product-detail.html?productId=${product.productId}"
                            >
                                상세보기
                            </a>
                        </div>
                    </div>
                `;
            });

            container.className = 'product-container';
            container.innerHTML = html;

        } catch (error) {
            container.className = '';
            container.innerHTML = `
                <div class="empty-message">
                    찜 상품을 불러오는 중 문제가 발생했습니다.
                </div>
            `;

            console.error(error);
        }
    }

    function deleteFavorite(productId, button) {
        fetch(
            `/favorites/delete?productId=${encodeURIComponent(productId)}`,
            {
                method: 'POST'
            }
        )
            .then(response => response.text())
            .then(result => {
                if (result.includes('로그인')) {
                    alert('로그인 후 이용 가능합니다.');
                    return;
                }

                if (
                    result === '찜 삭제 완료' ||
                    result === '찜하지 않은 상품입니다.'
                ) {
                    const card = button.closest('[data-product-id]');

                    if (card) {
                        card.remove();
                    }

                    const remainingCards =
                        document.querySelectorAll('[data-product-id]');

                    if (remainingCards.length === 0) {
                        renderFavoriteEmptyBox();
                    }

                    return;
                }

                alert(result);
            })
            .catch(error => {
                alert('찜 취소 중 문제가 발생했습니다.');
                console.error(error);
            });
    }

    function renderFavoriteEmptyBox() {
        const container = document.getElementById('productContainer');

        container.className = '';

        container.innerHTML = `
            <div class="favorite-empty-box">
                <div class="favorite-empty-icon">♥</div>

                <h2 class="favorite-empty-title">
                    아직 찜한 상품이 없습니다
                </h2>

                <p class="favorite-empty-desc">
                    관심 있는 상품의 하트 버튼을 누르면<br>
                    이곳에서 찜한 상품을 한 번에 확인할 수 있습니다.
                </p>

                <div class="favorite-empty-tip">
                    상품 목록이나 카테고리에서 ♡ 버튼을 눌러<br>
                    관심 있는 상품을 저장해보세요.
                </div>

                <div
                    class="button-row"
                    style="justify-content:center;"
                >
                    <a
                        class="primary-button"
                        href="/product-list.html"
                    >
                        상품 둘러보기
                    </a>

                    <a
                        class="secondary-button"
                        href="/mypage.html"
                    >
                        마이페이지로 이동
                    </a>
                </div>
            </div>
        `;
    }

    function getProductCardClass(productStatus, reported) {
        if (reported) {
            return 'product-card reported-product-card';
        }

        if (productStatus === '거래완료') {
            return 'product-card completed-product-card';
        }

        if (productStatus === '예약중') {
            return 'product-card reserved-product-card';
        }

        return 'product-card';
    }

    function renderImageStatusBadge(productStatus, reported) {
        if (reported) {
            return `
                <div class="product-status-badge reported">
                    신고됨
                </div>
            `;
        }

        if (productStatus === '거래완료') {
            return `
                <div class="product-status-badge completed">
                    거래완료
                </div>
            `;
        }

        if (productStatus === '예약중') {
            return `
                <div class="product-status-badge reserved">
                    예약중
                </div>
            `;
        }

        return '';
    }

    function renderStatusBadge(productStatus, reported) {
        if (reported) {
            return `
                <span
                    class="product-status-badge reported"
                    style="position:static;"
                >
                    신고됨
                </span>
            `;
        }

        if (productStatus === '판매중') {
            return `
                <span class="detail-status-badge sale">
                    판매중
                </span>
            `;
        }

        if (productStatus === '예약중') {
            return `
                <span class="detail-status-badge reserved">
                    예약중
                </span>
            `;
        }

        if (productStatus === '거래완료') {
            return `
                <span class="detail-status-badge completed">
                    거래완료
                </span>
            `;
        }

        return `
            <span class="detail-status-badge default">
                ${escapeHtml(productStatus)}
            </span>
        `;
    }

    function formatRelativeTime(dateText) {
        if (!dateText) {
            return '';
        }

        const targetDate = new Date(dateText);

        if (Number.isNaN(targetDate.getTime())) {
            return dateText;
        }

        const now = new Date();
        const diffSeconds =
            Math.floor((now.getTime() - targetDate.getTime()) / 1000);

        if (diffSeconds < 60) {
            return '방금 전';
        }

        const diffMinutes =
            Math.floor(diffSeconds / 60);

        if (diffMinutes < 60) {
            return `${diffMinutes}분 전`;
        }

        const diffHours =
            Math.floor(diffMinutes / 60);

        if (diffHours < 24) {
            return `${diffHours}시간 전`;
        }

        const diffDays =
            Math.floor(diffHours / 24);

        if (diffDays < 30) {
            return `${diffDays}일 전`;
        }

        const diffMonths =
            Math.floor(diffDays / 30);

        if (diffMonths < 12) {
            return `${diffMonths}개월 전`;
        }

        const diffYears =
            Math.floor(diffMonths / 12);

        return `${diffYears}년 전`;
    }

    function renderLoginRequiredBox() {
        return `
            <div class="login-required-box">
                <h2 class="login-required-title">
                    로그인이 필요합니다
                </h2>

                <p class="login-required-desc">
                    내 찜 상품은 로그인한 사용자만 확인할 수 있습니다.<br>
                    먼저 로그인한 뒤 다시 이용해주세요.
                </p>

                <div
                    class="button-row"
                    style="justify-content:center;"
                >
                    <a
                        class="primary-button"
                        href="/login.html"
                    >
                        로그인하러 가기
                    </a>

                    <a
                        class="secondary-button"
                        href="/index.html"
                    >
                        메인으로 이동
                    </a>
                </div>
            </div>
        `;
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeDrawer();
        }
    });
</script>

</body>
</html>
