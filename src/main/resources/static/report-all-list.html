<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전체 신고 목록</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/form.css">

    <style>
        .report-empty-box {
            max-width: 760px;
            margin: 40px auto 0;
            padding: 38px 34px;
            border-radius: 30px;
            text-align: center;
            background: linear-gradient(180deg, #fffdfb 0%, #fff5ec 100%);
            border: 1px solid #f0dfd0;
            box-shadow:
                    8px 10px 24px rgba(202, 166, 133, 0.12),
                    inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .report-empty-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #ffd0a1 0%, #ffad6b 100%);
            border: 1px solid #e9823a;
            color: #ffffff;
            font-size: 34px;
            box-shadow:
                    6px 8px 18px rgba(220, 104, 28, 0.22),
                    inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .report-empty-title {
            margin: 0;
            color: #70482c;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.4px;
        }

        .report-empty-desc {
            margin: 12px 0 22px;
            color: #876955;
            font-size: 15px;
            line-height: 1.8;
            font-weight: 700;
        }

        .report-empty-tip {
            margin: 0 auto 24px;
            padding: 16px 18px;
            max-width: 560px;
            border-radius: 20px;
            background: linear-gradient(180deg, #fff4e8 0%, #ffe4c8 100%);
            border: 1px solid #f0bf8c;
            color: #7a3d17;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.7;
        }
    </style>
</head>
<body>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

<aside class="side-drawer" id="sideDrawer">
    <div class="drawer-top">
        <div class="drawer-logo">oiso</div>
        <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>

    <p class="drawer-title">
        필요한 메뉴를 선택해서<br>
        원하는 화면으로 바로 이동할 수 있어요.
    </p>

    <nav class="drawer-menu">
        <a class="drawer-menu-link" href="/index.html">메인</a>
        <a class="drawer-menu-link" href="/product-list.html">상품목록</a>
        <a class="drawer-menu-link" href="/category/category.html">카테고리</a>
        <a class="drawer-menu-link" href="/product-register.html">상품등록</a>
        <a class="drawer-menu-link" href="/product-my-list.html">내 상품</a>
        <a class="drawer-menu-link" href="/exchange-requested-list.html">내가 신청한 교환</a>
        <a class="drawer-menu-link" href="/exchange-received-list.html">받은 교환</a>
        <a class="drawer-menu-link" href="/chat-room-list.html">채팅방</a>
        <a class="drawer-menu-link" href="/report-my-list.html">내 신고</a>
        <a class="drawer-menu-link current-menu" href="/report-all-list.html">전체 신고</a>
        <a class="drawer-menu-link" href="/exchange-guide.html">교환 가이드</a>
    </nav>

    <div class="drawer-bottom">현재 페이지: 전체 신고 목록</div>
</aside>

<div class="sub-top-bar">
    <button class="hamburger-button" onclick="openDrawer()">☰</button>
    <a href="/index.html" class="sub-home-link">oiso</a>
    <div class="sub-right-actions" id="subRightActions"></div>
</div>

<div class="page-body">
    <div class="page-header">
        <div>
            <h1 class="page-title">전체 신고 목록</h1>
            <p class="page-subtitle">
                전체 신고 내역을 확인할 수 있습니다.
            </p>
        </div>
        <div class="button-row">
            <a class="menu-link" href="/report-my-list.html">내 신고</a>
            <a class="menu-link" href="/product-list.html">상품목록</a>
        </div>
    </div>

    <div id="reportContainer" class="product-container report-list-container"></div>
</div>

<script>
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');

    function openDrawer() {
        sideDrawer.classList.add('open');
        drawerBackdrop.classList.add('show');
    }

    function closeDrawer() {
        sideDrawer.classList.remove('open');
        drawerBackdrop.classList.remove('show');
    }

    function logout() {
        alert('로그아웃되었습니다.');
        window.location.href = '/users/logout';
    }

    function renderSubRightActions(userData) {
        const subRightActions = document.getElementById('subRightActions');

        if (!subRightActions) {
            return;
        }

        if (userData.loggedIn) {
            subRightActions.innerHTML = `
                <a href="/mypage.html" class="main-icon-link" title="마이페이지">
                    <span class="person-icon person-icon-small"></span>
                </a>
                <button type="button" class="main-login-link main-logout-button" onclick="logout()">로그아웃</button>
            `;
        } else {
            subRightActions.innerHTML = '';
        }
    }

    checkLoginAndLoadAllReportList();

    function checkLoginAndLoadAllReportList() {
        fetch('/users/me-data')
            .then(response => response.json())
            .then(userData => {
                renderSubRightActions(userData);

                const container = document.getElementById('reportContainer');

                if (!userData.loggedIn) {
                    container.className = '';
                    container.innerHTML = renderLoginRequiredBox();
                    return;
                }

                loadAllReportList();
            })
            .catch(error => {
                const container = document.getElementById('reportContainer');
                container.className = '';
                container.innerHTML = renderLoginRequiredBox();
                console.error(error);
            });
    }

    function loadAllReportList() {
        fetch('/reports/all-list-data')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('reportContainer');

                if (!Array.isArray(data)) {
                    container.className = '';
                    container.innerHTML = '<div class="empty-message">신고 정보를 불러오지 못했습니다.</div>';
                    return;
                }

                if (data.length === 0) {
                    container.className = '';
                    container.innerHTML = renderAllReportEmptyBox();
                    return;
                }

                let html = '';

                data.forEach(report => {
                    html += `
                        <div class="product-card trade-card report-card">
                            <div class="trade-image-wrap">
                                <img
                                    src="${escapeHtml(report.productImagePath || '')}"
                                    alt="${escapeHtml(report.productName || '신고 상품')}"
                                    class="trade-image"
                                >
                            </div>

                            <div class="trade-card-title report-card-title">
                                ${escapeHtml(report.productName || '삭제되었거나 없는 상품')}
                            </div>

                            <div class="report-writer-text">
                                신고자 ${escapeHtml(report.reporterEmail)}
                            </div>

                            <div class="trade-status-row">
                                <span class="report-status-badge ${getReportStatusClass(report.reportStatus)}">
                                    ${escapeHtml(report.reportStatus)}
                                </span>
                            </div>

                            <div class="trade-info-list">
                                <div class="trade-info-line">
                                    <strong>신고사유</strong>
                                    <span>${escapeHtml(report.reportReason == null ? '' : report.reportReason)}</span>
                                </div>
                                <div class="trade-info-line">
                                    <strong>신고일</strong>
                                    <span>${formatRelativeTime(report.regDt)}</span>
                                </div>
                            </div>

                            <div class="button-row">
                                <a class="secondary-button" href="/product-detail.html?productId=${report.productId}">상품 상세보기</a>
                            </div>
                        </div>
                    `;
                });

                container.className = 'product-container report-list-container';
                container.innerHTML = html;
            })
            .catch(error => {
                const container = document.getElementById('reportContainer');
                container.className = '';
                container.innerHTML = '<div class="empty-message">신고 정보를 불러오는 중 문제가 발생했습니다.</div>';
                console.error(error);
            });
    }

    function getReportStatusClass(status) {
        if (status === '접수') {
            return 'report-status-received';
        }

        if (status === '처리중') {
            return 'report-status-processing';
        }

        if (status === '처리완료') {
            return 'report-status-completed';
        }

        if (status === '반려') {
            return 'report-status-rejected';
        }

        return 'report-status-received';
    }

    function renderAllReportEmptyBox() {
        return `
            <div class="report-empty-box">
                <div class="report-empty-icon">🛡️</div>
                <h2 class="report-empty-title">현재 접수된 신고가 없습니다</h2>
                <p class="report-empty-desc">
                    신고가 접수되면 이곳에서 전체 신고 내역과<br>
                    신고된 상품 정보를 확인할 수 있습니다.
                </p>
                <div class="report-empty-tip">
                    문제가 있는 상품은 상품 상세페이지에서 신고할 수 있습니다.<br>
                    접수된 신고는 이 화면에 자동으로 표시됩니다.
                </div>
                <div class="button-row" style="justify-content:center;">
                    <a class="primary-button" href="/product-list.html">상품목록 보기</a>
                    <a class="secondary-button" href="/report-my-list.html">내 신고 보기</a>
                    <a class="secondary-button" href="/index.html">메인으로 이동</a>
                </div>
            </div>
        `;
    }

    function formatRelativeTime(dateText) {
        if (!dateText) {
            return '';
        }

        const targetDate = new Date(dateText);

        if (Number.isNaN(targetDate.getTime())) {
            return dateText;
        }

        const now = new Date();
        const diffSeconds = Math.floor((now.getTime() - targetDate.getTime()) / 1000);

        if (diffSeconds < 60) {
            return '방금 전';
        }

        const diffMinutes = Math.floor(diffSeconds / 60);

        if (diffMinutes < 60) {
            return `${diffMinutes}분 전`;
        }

        const diffHours = Math.floor(diffMinutes / 60);

        if (diffHours < 24) {
            return `${diffHours}시간 전`;
        }

        const diffDays = Math.floor(diffHours / 24);

        if (diffDays < 30) {
            return `${diffDays}일 전`;
        }

        const diffMonths = Math.floor(diffDays / 30);

        if (diffMonths < 12) {
            return `${diffMonths}개월 전`;
        }

        const diffYears = Math.floor(diffMonths / 12);
        return `${diffYears}년 전`;
    }

    function renderLoginRequiredBox() {
        return `
            <div class="login-required-box">
                <h2 class="login-required-title">로그인이 필요합니다</h2>
                <p class="login-required-desc">
                    전체 신고 목록은 로그인한 뒤 이용할 수 있습니다.<br>
                    먼저 로그인한 뒤 다시 이용해주세요.
                </p>
                <div class="button-row" style="justify-content:center;">
                    <a class="primary-button" href="/login.html">로그인하러 가기</a>
                    <a class="secondary-button" href="/index.html">메인으로 이동</a>
                </div>
            </div>
        `;
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeDrawer();
        }
    });
</script>
</body>
</html>
