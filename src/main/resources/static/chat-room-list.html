<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅방 목록</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/chat.css">

    <style>
        .chat-list-page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 28px 20px 80px;
        }

        .chat-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .chat-list-title {
            margin: 0;
            font-size: 34px;
            font-weight: 900;
            color: #70482c;
            letter-spacing: -0.7px;
        }

        .chat-list-header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chat-list-menu-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #f0d7c1;
            color: #70482c;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 6px 14px rgba(181, 132, 86, 0.09);
        }

        .chat-list-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-trade-card {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.55fr 0.9fr;
            gap: 30px;
            padding: 26px;
            border-radius: 34px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 249, 243, 0.97) 100%);
            border: 1px solid #f1dfcf;
            box-shadow:
                    10px 12px 26px rgba(186, 130, 77, 0.13),
                    -2px -2px 10px rgba(255, 255, 255, 0.72),
                    inset 0 1px 0 rgba(255, 255, 255, 0.95);
            box-sizing: border-box;
        }

        .chat-trade-card.chat-progress-card {
            background: linear-gradient(180deg, #ffd0a1 0%, #ffad6b 100%);
            border: 1px solid #e9823a;
            box-shadow:
                    10px 12px 26px rgba(220, 104, 28, 0.24),
                    inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }

        .chat-trade-card.chat-completed-card {
            background: linear-gradient(180deg, #e3e7ea 0%, #c1c8cf 100%);
            border: 1px solid #a8b1ba;
            box-shadow:
                    10px 12px 26px rgba(88, 96, 106, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.74);
        }

        .chat-product-pair {
            display: grid;
            grid-template-columns: 1fr 48px 1fr;
            gap: 16px;
            align-items: center;
        }

        .chat-product-mini-card {
            min-width: 0;
            padding: 14px;
            border-radius: 26px;
            background: rgba(255, 248, 241, 0.92);
            border: 1px solid #f2ddc8;
            box-sizing: border-box;
        }

        .chat-product-label {
            margin-bottom: 10px;
            color: #8b603f;
            font-size: 15px;
            font-weight: 900;
        }

        .chat-product-image-box {
            width: 100%;
            height: 170px;
            border-radius: 20px;
            overflow: hidden;
            background: #fff1e4;
            border: 1px solid #f2ddc8;
        }

        .chat-product-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .chat-no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a47b60;
            font-size: 13px;
            font-weight: 800;
        }

        .chat-product-name {
            margin-top: 11px;
            color: #70482c;
            font-size: 15px;
            font-weight: 900;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-swap-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #ffbd73 0%, #ff9f3f 100%);
            color: white;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 8px 18px rgba(255, 150, 58, 0.22);
        }

        .chat-card-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 4px;
        }

        .chat-card-info-top {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .chat-card-badge {
            width: fit-content;
            padding: 7px 13px;
            border-radius: 999px;
            background: #fff3e7;
            border: 1px solid #f0d7c1;
            color: #8b603f;
            font-size: 12px;
            font-weight: 900;
        }

        .chat-status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            min-height: 31px;
            padding: 7px 13px;
            border-radius: 999px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: -0.2px;
            text-shadow: 0 1px 2px rgba(80, 45, 20, 0.22);
            box-shadow:
                    4px 6px 14px rgba(90, 54, 24, 0.18),
                    inset 0 1px 0 rgba(255, 255, 255, 0.5),
                    inset 0 -2px 4px rgba(70, 40, 20, 0.12);
        }

        .chat-status-badge.progress {
            background: linear-gradient(180deg, #d85f1f 0%, #b94813 100%);
            border: 1px solid #a63f10;
        }

        .chat-status-badge.completed {
            background: linear-gradient(180deg, #5f666e 0%, #343a40 100%);
            border: 1px solid #2b3035;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        }

        .chat-other-user-name {
            margin: 2px 0 0;
            color: #70482c;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .chat-card-desc {
            margin: 0;
            color: #8b6a55;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.6;
        }

        .chat-created-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 42px;
            padding: 10px 13px;
            border-radius: 17px;
            background: rgba(255, 247, 239, 0.88);
            border: 1px solid #f4dfcb;
            color: #6d5140;
            font-size: 13px;
            box-sizing: border-box;
        }

        .chat-created-row span {
            color: #8b603f;
            font-weight: 900;
        }

        .chat-created-row strong {
            font-weight: 800;
        }

        .chat-enter-button {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            width: 100%;
            border-radius: 999px;
            background: linear-gradient(180deg, #ffb25f 0%, #ff9638 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            text-decoration: none;
            box-shadow:
                    0 8px 18px rgba(255, 150, 58, 0.22),
                    inset 0 1px 0 rgba(255, 255, 255, 0.45);
        }

        .chat-empty-box {
            max-width: 760px;
            margin: 40px auto 0;
            padding: 38px 34px;
            border-radius: 30px;
            text-align: center;
            background: linear-gradient(180deg, #fffdfb 0%, #fff5ec 100%);
            border: 1px solid #f0dfd0;
            box-shadow:
                    8px 10px 24px rgba(202, 166, 133, 0.12),
                    inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .chat-empty-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #ffd0a1 0%, #ffad6b 100%);
            border: 1px solid #e9823a;
            color: #ffffff;
            font-size: 34px;
            box-shadow:
                    6px 8px 18px rgba(220, 104, 28, 0.22),
                    inset 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .chat-empty-title {
            margin: 0;
            color: #70482c;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.4px;
        }

        .chat-empty-desc {
            margin: 12px 0 22px;
            color: #876955;
            font-size: 15px;
            line-height: 1.8;
            font-weight: 700;
        }

        .chat-empty-tip {
            margin: 0 auto 24px;
            padding: 16px 18px;
            max-width: 560px;
            border-radius: 20px;
            background: linear-gradient(180deg, #fff4e8 0%, #ffe4c8 100%);
            border: 1px solid #f0bf8c;
            color: #7a3d17;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.7;
        }

        @media (max-width: 1000px) {
            .chat-trade-card {
                max-width: 100%;
                grid-template-columns: 1fr;
            }

            .chat-product-image-box {
                height: 180px;
            }
        }

        @media (max-width: 720px) {
            .chat-list-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .chat-list-title {
                font-size: 30px;
            }

            .chat-list-header-actions {
                width: 100%;
            }

            .chat-list-menu-link {
                flex: 1;
            }

            .chat-product-pair {
                grid-template-columns: 1fr;
            }

            .chat-swap-icon {
                margin: 0 auto;
                transform: rotate(90deg);
            }

            .chat-product-image-box {
                height: 190px;
            }
        }
    </style>
</head>
<body>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer()"></div>

<aside class="side-drawer" id="sideDrawer">
    <div class="drawer-top">
        <div class="drawer-logo">oiso</div>
        <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>

    <p class="drawer-title">
        필요한 메뉴를 선택해서<br>
        원하는 화면으로 바로 이동할 수 있어요.
    </p>

    <nav class="drawer-menu">
        <a class="drawer-menu-link" href="/index.html">메인</a>
        <a class="drawer-menu-link" href="/product-list.html">상품목록</a>
        <a class="drawer-menu-link" href="/category/category.html">카테고리</a>
        <a class="drawer-menu-link" href="/product-register.html">상품등록</a>
        <a class="drawer-menu-link" href="/product-my-list.html">내 상품</a>
        <a class="drawer-menu-link" href="/exchange-requested-list.html">내가 신청한 교환</a>
        <a class="drawer-menu-link" href="/exchange-received-list.html">받은 교환</a>
        <a class="drawer-menu-link current-menu" href="/chat-room-list.html">채팅방</a>
        <a class="drawer-menu-link" href="/report-my-list.html">내 신고</a>
        <a class="drawer-menu-link" href="/report-all-list.html">전체 신고</a>
        <a class="drawer-menu-link" href="/exchange-guide.html">교환 가이드</a>
    </nav>

    <div class="drawer-bottom">현재 페이지: 채팅방 목록</div>
</aside>

<div class="sub-top-bar">
    <button class="hamburger-button" onclick="openDrawer()">☰</button>
    <a href="/index.html" class="sub-home-link">oiso</a>
    <div class="sub-right-actions" id="subRightActions"></div>
</div>

<div class="page-body">
    <div class="chat-list-page">
        <div class="chat-list-header">
            <h1 class="chat-list-title">채팅방 목록</h1>

            <div class="chat-list-header-actions">
                <a class="chat-list-menu-link" href="/exchange-received-list.html">받은 교환</a>
                <a class="chat-list-menu-link" href="/exchange-requested-list.html">내가 신청한 교환</a>
            </div>
        </div>

        <div id="chatRoomContainer" class="chat-list-container"></div>
    </div>
</div>

<script>
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');

    let loginUserEmail = '';

    function openDrawer() {
        sideDrawer.classList.add('open');
        drawerBackdrop.classList.add('show');
    }

    function closeDrawer() {
        sideDrawer.classList.remove('open');
        drawerBackdrop.classList.remove('show');
    }

    function logout() {
        alert('로그아웃되었습니다.');
        window.location.href = '/users/logout';
    }

    function renderSubRightActions(userData) {
        const subRightActions = document.getElementById('subRightActions');

        if (!subRightActions) {
            return;
        }

        if (userData.loggedIn) {
            subRightActions.innerHTML = `
                <a href="/mypage.html" class="main-icon-link" title="마이페이지">
                    <span class="person-icon person-icon-small"></span>
                </a>
                <button type="button" class="main-login-link main-logout-button" onclick="logout()">로그아웃</button>
            `;
        } else {
            subRightActions.innerHTML = '';
        }
    }

    checkLoginAndLoadChatRoomList();

    function checkLoginAndLoadChatRoomList() {
        fetch('/users/me-data')
            .then(response => response.json())
            .then(userData => {
                renderSubRightActions(userData);

                const container = document.getElementById('chatRoomContainer');

                if (!userData.loggedIn) {
                    container.className = '';
                    container.innerHTML = renderLoginRequiredBox();
                    return;
                }

                loginUserEmail = userData.userEmail || '';
                loadChatRoomList();
            })
            .catch(error => {
                const container = document.getElementById('chatRoomContainer');
                container.className = '';
                container.innerHTML = renderLoginRequiredBox();
                console.error(error);
            });
    }

    function loadChatRoomList() {
        fetch('/chat-rooms/my-list-data')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('chatRoomContainer');

                if (!Array.isArray(data)) {
                    container.className = '';
                    container.innerHTML = '<div class="empty-message">채팅방 정보를 불러오지 못했습니다.</div>';
                    return;
                }

                if (data.length === 0) {
                    container.className = '';
                    container.innerHTML = renderChatRoomEmptyBox();
                    return;
                }

                let html = '';

                data.forEach(chatRoom => {
                    const isSeller = loginUserEmail === chatRoom.sellerEmail;

                    const otherProductName = isSeller
                        ? safeText(chatRoom.requesterProductName)
                        : safeText(chatRoom.productName);

                    const otherProductImagePath = isSeller
                        ? safeText(chatRoom.requesterProductImagePath)
                        : safeText(chatRoom.productImagePath);

                    const myProductName = isSeller
                        ? safeText(chatRoom.productName)
                        : safeText(chatRoom.requesterProductName);

                    const myProductImagePath = isSeller
                        ? safeText(chatRoom.productImagePath)
                        : safeText(chatRoom.requesterProductImagePath);

                    const otherUserName = safeText(chatRoom.otherUserName);
                    const createdAt = formatDateTime(chatRoom.createdAt);
                    const productStatus = safeText(chatRoom.productStatus);
                    const chatCardClass = getChatCardClass(productStatus);
                    const chatStatusBadge = renderChatStatusBadge(productStatus);

                    html += `
                        <div class="${chatCardClass}">
                            <div class="chat-product-pair">
                                <div class="chat-product-mini-card">
                                    <div class="chat-product-label">상대방 상품</div>
                                    <div class="chat-product-image-box">
                                        ${renderProductImage(otherProductImagePath, '상대방 상품 이미지')}
                                    </div>
                                    <div class="chat-product-name">${escapeHtml(otherProductName || '상품 정보 없음')}</div>
                                </div>

                                <div class="chat-swap-icon">↔</div>

                                <div class="chat-product-mini-card">
                                    <div class="chat-product-label">내 상품</div>
                                    <div class="chat-product-image-box">
                                        ${renderProductImage(myProductImagePath, '내 상품 이미지')}
                                    </div>
                                    <div class="chat-product-name">${escapeHtml(myProductName || '상품 정보 없음')}</div>
                                </div>
                            </div>

                            <div class="chat-card-info">
                                <div class="chat-card-info-top">
                                    <div class="chat-badge-row">
                                        <span class="chat-card-badge">교환 채팅</span>
                                        ${chatStatusBadge}
                                    </div>
                                    <h3 class="chat-other-user-name">${escapeHtml(otherUserName || '상대방')}</h3>
                                    <p class="chat-card-desc">
                                        ${escapeHtml(otherProductName || '상대방 상품')} 교환 채팅방입니다.
                                    </p>
                                </div>

                                <div class="chat-created-row">
                                    <span>생성일</span>
                                    <strong>${escapeHtml(createdAt)}</strong>
                                </div>

                                <a class="chat-enter-button" href="/chat-message.html?chatRoomId=${encodeURIComponent(chatRoom.chatRoomId)}">
                                    채팅방 입장
                                </a>
                            </div>
                        </div>
                    `;
                });

                container.className = 'chat-list-container';
                container.innerHTML = html;
            })
            .catch(error => {
                const container = document.getElementById('chatRoomContainer');
                container.className = '';
                container.innerHTML = renderLoginRequiredBox();
                console.error(error);
            });
    }

    function getChatCardClass(productStatus) {
        if (productStatus === '거래완료') {
            return 'chat-trade-card chat-completed-card';
        }

        if (productStatus === '예약중' || productStatus === '거래중') {
            return 'chat-trade-card chat-progress-card';
        }

        return 'chat-trade-card';
    }

    function renderChatStatusBadge(productStatus) {
        if (productStatus === '거래완료') {
            return '<span class="chat-status-badge completed">거래완료</span>';
        }

        if (productStatus === '예약중' || productStatus === '거래중') {
            return '<span class="chat-status-badge progress">거래중</span>';
        }

        return '';
    }

    function renderChatRoomEmptyBox() {
        return `
            <div class="chat-empty-box">
                <div class="chat-empty-icon">💬</div>
                <h2 class="chat-empty-title">아직 참여 중인 채팅방이 없습니다</h2>
                <p class="chat-empty-desc">
                    교환 신청이 수락되면 채팅방이 자동으로 생성되고,<br>
                    이곳에서 상대방과 교환을 이어갈 수 있습니다.
                </p>
                <div class="chat-empty-tip">
                    채팅방은 직접 만드는 화면이 아니라 교환 신청이 수락된 뒤 생성됩니다.<br>
                    먼저 마음에 드는 상품에 교환 신청을 보내보세요.
                </div>
                <div class="button-row" style="justify-content:center;">
                    <a class="primary-button" href="/product-list.html">상품 둘러보기</a>
                    <a class="secondary-button" href="/exchange-requested-list.html">내가 신청한 교환 보기</a>
                    <a class="secondary-button" href="/exchange-received-list.html">받은 교환 보기</a>
                </div>
            </div>
        `;
    }

    function renderProductImage(imagePath, altText) {
        if (!imagePath) {
            return `<div class="chat-no-image">사진 없음</div>`;
        }

        return `<img src="${escapeHtml(imagePath)}" alt="${escapeHtml(altText)}">`;
    }

    function formatDateTime(value) {
        if (!value) {
            return '-';
        }

        const text = String(value).replace('T', ' ');

        if (text.length >= 16) {
            return text.substring(0, 16);
        }

        return text;
    }

    function safeText(value) {
        if (value == null) {
            return '';
        }

        return String(value);
    }

    function renderLoginRequiredBox() {
        return `
            <div class="login-required-box">
                <h2 class="login-required-title">로그인이 필요합니다</h2>
                <p class="login-required-desc">
                    채팅방 목록은 로그인한 사용자만 확인할 수 있습니다.<br>
                    먼저 로그인한 뒤 다시 이용해주세요.
                </p>
                <div class="button-row" style="justify-content:center;">
                    <a class="primary-button" href="/login.html">로그인하러 가기</a>
                    <a class="secondary-button" href="/index.html">메인으로 이동</a>
                </div>
            </div>
        `;
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeDrawer();
        }
    });
</script>
</body>
</html>
